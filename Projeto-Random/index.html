<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

    <title>Sorteador</title>
</head>

<body>
    <div class="containerInicio">
            <img src="./assets/dadoSorteio.png" alt="Dado dourado" class="logotipo">
            <h1 class="titulo">Sorteador Dev Charlles</h1>
    </div>

    <div class="information">
        <h2 class="sortear">Sortear um Número</h2>
        <p class="legenda">Defina o intervalo e deixe o destino decidir.</p>
    </div>

    <div class="containerNumeros">

        <div class="containerMinMax">
            <div class="min">
                <label class="labelTexto" for="min">MÍNIMO</label>
                <input type="number" id="min" placeholder="0" class="primeiroNumero">
                
            </div>
        
            <div class="max">
                <label class="labelTexto" for="max">MÁXIMO</label>
                <input type="number" id="max" placeholder=" 100" class="segundoNumero">
            </div>
        </div>
    
        <button class="botaoSortear">🎲 SORTEAR AGORA</button>
    </div>

    <div class="resultado">
        <p class="textoSorteado">🎉 Número Sorteado</p>
        <p class="numeroSorteado">0</p>
        <p class="escolhaSorteio">Entre 0 e 100</p>
    </div>

</body>
<script src="./script.js"></script>

</html>
